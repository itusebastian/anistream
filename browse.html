<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Browse Anime Seasons — AniStream</title>
    <meta name="description" content="Explore current, upcoming, and past anime seasons on AniStream. Filter by year and season to find your next favorite show.">
    <meta name="author" content="Sebastián Iturralde">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="favicon.ico">

    <!-- Open Graph / Facebook / Discord (Social Media Metadata Fallbacks) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Browse Anime Seasons — AniStream">
    <meta property="og:description" content="Explore current, upcoming, and past anime seasons. Filter by year and season to discover what's airing now.">
    <meta property="og:url" content="https://byulabs.github.io/wdd231/final/season.html">
    <meta property="og:image" content="https://byulabs.github.io/wdd231/final/images/anistream-og-banner.jpg">
    <meta property="og:site_name" content="AniStream">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Browse Anime Seasons — AniStream">
    <meta name="twitter:description" content="Explore current, upcoming, and past anime seasons. Filter by year and season to discover what's airing now.">
    <meta name="twitter:image" content="https://byulabs.github.io/wdd231/final/images/anistream-og-banner.jpg">

    <!-- Performance & Network Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.jikan.moe">

    <!-- Typography & Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- Application Initialization Orchestrator -->
    <script type="module" src="scripts/main.mjs"></script>
</head>
<body>

    <!-- ============ HEADER / NAVIGATION ============ -->
    <header>
        <div class="header-container">

            <!-- Logo -->
            <a href="index.html" class="logo">
                <span class="logo-text">Ani<span class="logo-accent">Stream</span></span>
            </a>

            <!-- Center Nav Links (Desktop) -->
            <nav class="desktop-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="browse.html" class="nav-link active">Browse Season</a>
                <a href="schedule.html" class="nav-link">Schedule</a>
            </nav>

            <!-- Right Side: Search Button -->
            <div class="search-container">
                <button class="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                    <span>Search anime...</span>
                </button>
            </div>

            <!-- Mobile: Search + Hamburger -->
            <div class="mobile-controls">
                <button class="mobile-search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-md"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                </button>
                <button id="menuToggle" class="mobile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-lg"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Slide Menu -->
    <div id="mobileOverlay"></div>
    <nav id="mobileMenu" class="mobile-menu">
        <button id="mobileMenuClose" class="mobile-menu-close" aria-label="Close mobile menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-lg"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse Season</a>
        <a href="schedule.html">Schedule</a>
    </nav>

    <main class="page-main">
        <div class="page-container">

            <div class="header-wrapper">
                <div class="heading-title-row">
                    <div class="section-line"></div>
                    <h1 id="browseTitle" class="main-title">Season</h1>
                </div>
                <p class="page-subtitle">Explore the latest and most popular series currently airing</p>
            </div>

            <div class="filter-toolbar">
                <div class="filter-group-left">
                
                    <div class="custom-select-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-icon-left"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                        <select id="filterGenre">
                            <option value="all">All Genres</option>
                            <option value="action">Action</option>
                            <option value="fantasy">Fantasy</option>
                            <option value="comedy">Comedy</option>
                            <option value="drama">Drama</option>
                        </select>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-arrow-right"><path d="m6 9 6 6 6-6"/></svg>
                    </div>

                    <div class="custom-select-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-icon-left"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                        <select id="filterSource">
                            <option value="all">All Sources</option>
                            <option value="manga">Manga Adaptations</option>
                            <option value="light novel">Light Novels</option>
                            <option value="original">Original Works</option>
                            <option value="other">Other (Games/Web-toons)</option>
                        </select>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-arrow-right"><path d="m6 9 6 6 6-6"/></svg>
                    </div>

                </div>

                <div class="filter-group-right">

                    <div class="custom-select-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-icon-left"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
                        <select id="filterSort">
                            <option value="popular">Most Popular</option>
                            <option value="rated">Highest Rated</option>
                            <option value="az">Alphabetical (A-Z)</option>
                        </select>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-arrow-right"><path d="m6 9 6 6 6-6"/></svg>
                    </div>

                </div>
            </div>

            <div id="animeGrid" class="anime-grid grid-layout"></div>

        </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer>
        <div class="footer-container">
            <a href="#" class="footer-logo">
                Ani<span class="footer-logo-accent">Stream</span>
            </a>
            <p class="footer-text">&copy; 2026 AniStream. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
